name: Android derleme

on:
  push:
    branches: [main, nokta-hesap]
    paths-ignore: ['docs/**', 'store/**', 'README.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Uygulama kodunu sıkıştır
        run: |
          mkdir -p "$RUNNER_TEMP/sk" && cp tools/sikistir.mjs "$RUNNER_TEMP/sk/"
          (cd "$RUNNER_TEMP/sk" && npm i --no-save --silent terser@5.31.6)
          node "$RUNNER_TEMP/sk/sikistir.mjs" app/src/main/assets/index.html app/src/main/assets/ncz.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK lisansları
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Derle
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
          mkdir -p cikti
          cp app/build/outputs/apk/debug/*.apk cikti/Pafta-deneme.apk
          cp app/build/outputs/bundle/release/*.aab cikti/Pafta-imzasiz.aab
          echo "${{ github.run_number }}" > cikti/surum.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Pafta
          path: cikti/

      - name: Çıktıları "builds" (deneme dallarında "deneme-apk") dalına koy
        run: |
          HEDEF=builds; [ "${{ github.ref_name }}" = "main" ] || HEDEF=deneme-apk
          cd cikti
          git init -q -b "$HEDEF"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Derleme ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$HEDEF"
