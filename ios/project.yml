# Pafta iOS projesi. Xcode projesi bu dosyadan XcodeGen ile üretilir (GitHub Actions'ta).
# Ortak kabuk: ios/Shell. Uygulamanın kendisi Android'deki ile aynı sayfa; ios/hazirla.sh site klasörünü hazırlar.
name: Pafta
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Pafta:
    type: application
    platform: iOS
    sources:
      - path: Shell
      - path: Pafta/Assets.xcassets
      - path: gen/Pafta/site
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.egemen.pafta
        PRODUCT_NAME: Pafta
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SHELL_NO_LOCATION
        INFOPLIST_FILE: Pafta/Info.plist
    info:
      path: Pafta/Info.plist
      properties: {"CFBundleDisplayName": "Pafta", "CFBundleShortVersionString": "$(MARKETING_VERSION)", "CFBundleVersion": "$(CURRENT_PROJECT_VERSION)", "CFBundleDevelopmentRegion": "tr", "LSRequiresIPhoneOS": true, "ITSAppUsesNonExemptEncryption": false, "UIRequiresFullScreen": true, "UIStatusBarStyle": "UIStatusBarStyleLightContent", "UIViewControllerBasedStatusBarAppearance": true, "UISupportedInterfaceOrientations": ["UIInterfaceOrientationPortrait", "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"], "UILaunchScreen": {"UIColorName": "LaunchBg"}, "UIApplicationSceneManifest": {"UIApplicationSupportsMultipleScenes": false, "UISceneConfigurations": {"UIWindowSceneSessionRoleApplication": [{"UISceneConfigurationName": "Default", "UISceneDelegateClassName": "$(PRODUCT_MODULE_NAME).SceneDelegate"}]}}, "Shell": {"Background": "#050806", "LightStatusBar": true, "Orientation": "all", "Bridge": "files", "Incoming": "binary"}, "LSSupportsOpeningDocumentsInPlace": false, "UTImportedTypeDeclarations": [{"UTTypeIdentifier": "com.netcad.ncz", "UTTypeDescription": "Netcad NCZ", "UTTypeConformsTo": ["public.data"], "UTTypeTagSpecification": {"public.filename-extension": ["ncz", "NCZ"]}}], "CFBundleDocumentTypes": [{"CFBundleTypeName": "Netcad NCZ", "CFBundleTypeRole": "Viewer", "LSHandlerRank": "Alternate", "LSItemContentTypes": ["com.netcad.ncz"]}]}
