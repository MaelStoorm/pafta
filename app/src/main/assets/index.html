<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1e6b47">
<title>Pafta</title>
<style>
:root{
  --bg:#050806; --panel:#0f1512; --panel2:#17211c; --line:#26352d; --ink:#eef4f0; --muted:#9aaba2;
  --accent:#1e6b47; --accent-ink:#ffffff; --hl:#3fd08f; --ok:#7bd88f; --err:#ff6b5e;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--hl);outline-offset:2px}

/* üst bar */
.top{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-t)) 12px 8px;background:var(--accent);color:var(--accent-ink);flex:none;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:.01em}
.brand svg{width:30px;height:30px}
.fname{flex:1;min-width:0;font:600 13px ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.75}
.topbtn{border:2px solid var(--accent-ink);background:transparent;color:var(--accent-ink);border-radius:10px;padding:7px 12px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
.topbtn svg{width:18px;height:18px}
.info{width:34px;height:34px;padding:0;justify-content:center;border-radius:50%;font:italic 700 17px Georgia,serif}

/* çizim alanı */
main{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.empty svg{width:84px;height:84px;color:var(--hl)}
.empty h1{margin:4px 0 0;font-size:24px}
.empty p{margin:0;color:var(--muted);font-size:15px;max-width:300px;line-height:1.45}
.bigbtn{border:0;border-radius:14px;padding:14px 26px;font-weight:800;font-size:17px;background:var(--accent);color:var(--accent-ink);min-width:240px}
.ghost{border:1px solid var(--line);border-radius:14px;padding:12px 22px;font-weight:700;font-size:15px;background:var(--panel);min-width:240px}
.hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#000c;border:1px solid var(--line);color:var(--ink);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;pointer-events:none}
.fab{position:absolute;right:12px;top:10px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.fab svg{width:20px;height:20px}
.fabs{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.zbtn{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:24px;font-weight:700;line-height:1}
.zbtn.small{font-size:12px;font-weight:800}
.zbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale{position:absolute;left:12px;bottom:14px;font:600 12px ui-monospace,Menlo,monospace;color:var(--muted);pointer-events:none}
.scale i{display:block;height:6px;border:2px solid var(--muted);border-top:0;margin-bottom:3px}

/* sonuç kartı */
.card{position:absolute;left:10px;right:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px #0008;max-width:520px;margin:0 auto}
.card .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:3px 0}
.card .k{color:var(--muted);font-size:14px}
.card .v{font:700 18px ui-monospace,Menlo,monospace}
.card .title{font-weight:800;font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card .acts{display:flex;gap:8px;margin-top:10px}
.card .acts button{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px;font-weight:700;font-size:14px}
.card .acts button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}

/* alt bar */
.bar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b));flex:none;z-index:5}
.bar button{border:0;background:transparent;border-radius:12px;padding:6px 1px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.bar button svg{width:26px;height:26px}
.bar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar button:disabled{opacity:.35}

/* alt pencere */
.sheet{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--panel);width:100%;max-width:560px;max-height:82vh;border-radius:20px 20px 0 0;padding:6px 16px calc(16px + var(--safe-b));display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 8px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sh-head h2{margin:0;font-size:20px}
.x{border:0;background:var(--panel2);width:36px;height:36px;border-radius:50%;font-size:20px}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch}
.lyr{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.lyr .dot{width:16px;height:16px;border-radius:4px;flex:none;border:1px solid #fff3}
.lyr .nm{flex:1;min-width:0;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lyr .cnt{color:var(--muted);font-size:13px}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.lyr[aria-checked="true"] .sw{background:var(--accent)}
.lyr[aria-checked="true"] .sw::after{left:21px}
.lyr[aria-checked="false"] .nm{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.two button,.fmt button{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px;font-weight:700;font-size:15px}
.fmt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.fmt button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px}
.fmt button b{font-size:17px}
.fmt button span{font-weight:500;font-size:12.5px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:10px;padding:10px 2px;font-size:15px}
.chk input{width:22px;height:22px;accent-color:var(--hl)}
.note{color:var(--muted);font-size:13.5px;line-height:1.5;margin:8px 0}
.about p{line-height:1.55;font-size:14.5px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:#000e;color:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;max-width:90vw;text-align:center}
/* nokta girme ve hesap */
.pform{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pform .full{grid-column:1/-1}
.inp{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);font:600 16px ui-monospace,Menlo,monospace;width:100%;min-width:0;user-select:text;-webkit-user-select:text}
.inp:focus{outline:2px solid var(--hl);outline-offset:0}
textarea.inp{min-height:96px;resize:vertical;font-size:14px}
.btnp{border:0;border-radius:12px;padding:13px;font-weight:800;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.btng{border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:700;font-size:15px;background:var(--panel2)}
.btng.danger{color:var(--err)}
.sec{margin:14px 0 4px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.prow input{width:22px;height:22px;accent-color:var(--hl);flex:none}
.prow .pc{flex:1;min-width:0;font:600 13px ui-monospace,Menlo,monospace;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pc b{font:700 15px system-ui,sans-serif;color:var(--ink);margin-right:6px}
.prow .del{border:0;background:var(--panel2);width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--muted);flex:none}
details.paste{margin:4px 0 8px}
details.paste summary{cursor:pointer;color:var(--hl);font-weight:700;font-size:14px;padding:6px 0}
.rrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.rrow .k{color:var(--muted);font-size:14px}
.rrow .v{font:700 17px ui-monospace,Menlo,monospace;text-align:right}
.rrow .v.cut{color:#ff9f43}.rrow .v.fill{color:#4fd1e8}
.refrow{display:flex;align-items:center;gap:10px;margin:8px 0}
.refrow label{flex:1;font-size:14px;color:var(--muted)}
.refrow .inp{width:140px;flex:none}
.busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;font-weight:700;font-size:16px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="5" fill="#050806"/><path d="M8 22 L14 9 L24 13 L20 24 Z" fill="none" stroke="#3fd08f" stroke-width="2.4" stroke-linejoin="round"/><circle cx="8" cy="22" r="2.2" fill="#3fd08f"/><circle cx="14" cy="9" r="2.2" fill="#3fd08f"/><circle cx="24" cy="13" r="2.2" fill="#3fd08f"/><circle cx="20" cy="24" r="2.2" fill="#3fd08f"/></svg>
    Pafta
  </div>
  <div class="fname" id="fname"></div>
  <button class="topbtn" id="openBtn" aria-label="Dosya aç">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Aç
  </button>
  <button class="topbtn info" id="infoBtn" aria-label="Hakkında">i</button>
</header>

<main id="stage">
  <canvas id="cv"></canvas>
  <div class="empty" id="empty">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="48" height="48" rx="6"/><path d="M18 44 L26 20 L44 26 L38 46 Z"/><circle cx="18" cy="44" r="3" fill="currentColor"/><circle cx="26" cy="20" r="3" fill="currentColor"/><circle cx="44" cy="26" r="3" fill="currentColor"/><circle cx="38" cy="46" r="3" fill="currentColor"/></svg>
    <h1>NCZ çizimini aç</h1>
    <p>Netcad'de çizilmiş .NCZ dosyalarını telefonunda görüntüle, koordinat oku ve ölçüm yap.</p>
    <button class="bigbtn" id="emptyOpen">Dosya aç</button>
    <button class="ghost" id="newBtn">Nokta gir, çiz, hesapla</button>
    <button class="ghost" id="demoBtn">Örnek çizimi göster</button>
  </div>
  <div class="hint" id="hint" hidden></div>
  <div class="fabs" id="fabs" hidden>
    <button class="zbtn" id="zIn" aria-label="Yakınlaştır">+</button>
    <button class="zbtn" id="zOut" aria-label="Uzaklaştır">−</button>
    <button class="zbtn small" id="zNames" aria-pressed="true" aria-label="Nokta adlarını göster">Adlar</button>
    <button class="zbtn small" id="zFit" aria-label="Tümünü göster">Tümü</button>
  </div>
  <div class="scale" id="scale" hidden></div>
  <div class="card" id="card" hidden></div>
  <div class="busy" id="busy" hidden>Açılıyor…</div>
</main>

<nav class="bar" id="bar">
  <button id="bLayers" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5z"/><path d="m2 13 10 5 10-5"/><path d="m2 18 10 5 10-5" opacity=".5"/></svg>Katmanlar</button>
  <button id="bCoord" aria-pressed="false" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>Koordinat</button>
  <button id="bMeasure" aria-pressed="false" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="8" width="20" height="8" rx="1.5" transform="rotate(-30 12 12)"/><path d="M7.5 11.5 9 14M11 9.5l1.5 2.5M14.5 7.5 16 10" transform="rotate(0)"/></svg>Ölç</button>
  <button id="bPoints">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 9 7l8 3-3 9z"/><circle cx="5" cy="19" r="2" fill="currentColor"/><circle cx="9" cy="7" r="2" fill="currentColor"/><circle cx="17" cy="10" r="2" fill="currentColor"/><path d="M19 15v6M16 18h6"/></svg>Noktalar</button>
  <button id="bExport" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg>Dışa aktar</button>
</nav>

<div class="sheet" id="sheet" hidden><div class="sheet-in" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sh-head"><h2 id="shTitle"></h2><button class="x" id="shClose" aria-label="Kapat">×</button></div>
  <div class="sh-body" id="shBody"></div>
</div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileIn" accept=".ncz,.NCZ" hidden>

<script src="ncz.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const AB=window.AndroidBridge||null;
const cv=$('cv'), ctx=cv.getContext('2d');
let M=null;            // açık çizim
let view={s:1,tx:0,ty:0};
let mode='';           // '', 'coord', 'measure'
let showNames=true;    // nokta adları
let pick=null;         // koordinat modunda seçilen yer
let meas=[];           // ölçüm noktaları [{x,y}]
let dpr=Math.max(1,window.devicePixelRatio||1);

/* ---------- yardımcılar ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f3=v=>v.toFixed(3);
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3200);}
function argbToCss(a){
  if(a==null)return '#e8e8e8';
  const r=(a>>>16)&255,g=(a>>>8)&255,b=a&255;
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  if(lum<0.22)return '#e8e8e8'; // siyah çizgiler koyu zeminde beyaz görünsün (Netcad gibi)
  return 'rgb('+r+','+g+','+b+')';
}

/* ---------- çizimi modele çevir ---------- */
function buildModel(r,fileName){
  const lyrMap=new Map(); const items=[];
  const names=r.layer_names||[], cols=r.layer_colors||[];
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  (r.entities||[]).forEach((e,i)=>{
    const cs=e.coordinates||[]; if(!cs.length)return;
    const lname=e.layer_name||('Katman '+e.layer_code);
    let L=lyrMap.get(lname);
    if(!L){const idx=names.indexOf(lname);L={name:lname,color:argbToCss(idx>=0?cols[idx]:e.color_argb),count:0,visible:true,points:0};lyrMap.set(lname,L);}
    L.count++;
    const kind=e.geometry_kind;
    const it={kind,L,color:e.color_argb!=null?argbToCss(e.color_argb):L.color,xy:cs.map(c=>[c.x,c.y]),z:cs[0].z,closed:!!e.is_closed||kind==='Polygon',
      text:e.label_text||'',name:e.name||'',h:e.text_height||0,rot:e.rotation_degrees||0};
    if(kind==='Point'||kind==='Symbol')L.points++;
    cs.forEach(c=>{if(c.x<minX)minX=c.x;if(c.x>maxX)maxX=c.x;if(c.y<minY)minY=c.y;if(c.y>maxY)maxY=c.y;});
    items.push(it);
  });
  if(!items.length)throw new Error('Bu dosyada çizim bulunamadı.');
  // hassasiyet için orijini çizimin köşesine taşı
  const ox=minX,oy=minY;
  const layers=[...lyrMap.values()].sort((a,b)=>a.name.localeCompare(b.name,'tr'));
  const m={file:fileName,items,layers,ox,oy,box:[minX,minY,maxX,maxY],version:r.version_name||'',unsupported:r.unsupported_geometry_types||{}};
  buildPaths(m); return m;
}
function buildPaths(m){
  // aynı katman+renk çizgileri tek Path2D'de (hızlı çizim)
  const groups=new Map();
  m.items.forEach(it=>{
    if(!(it.kind==='Line'||it.kind==='Polyline'||it.kind==='Polygon'||it.kind==='Arc'||it.kind==='Circle'||it.kind==='Box'||it.kind==='Triangle'||it.kind==='MapSheet'||(it.xy.length>1&&it.kind!=='Text')))return;
    const key=it.L.name+'|'+it.color; let g=groups.get(key);
    if(!g){g={L:it.L,color:it.color,p:new Path2D()};groups.set(key,g);}
    it.xy.forEach((c,i)=>{const x=c[0]-m.ox,y=c[1]-m.oy; if(i)g.p.lineTo(x,y); else g.p.moveTo(x,y);});
    if(it.closed&&it.xy.length>2)g.p.closePath();
  });
  m.paths=[...groups.values()];
  m.dots=m.items.filter(it=>(it.kind==='Point'||it.kind==='Symbol')&&it.xy.length===1);
  m.texts=m.items.filter(it=>it.kind==='Text'&&it.text);
  // yakalama için tüm köşe noktaları
  const v=[]; m.items.forEach(it=>{if(it.kind==='Text')return; it.xy.forEach(c=>v.push(c[0],c[1]));});
  m.verts=new Float64Array(v);
}

/* ---------- görünüm ---------- */
function resize(){
  const r=cv.getBoundingClientRect(); dpr=Math.max(1,window.devicePixelRatio||1);
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); draw();
}
function fit(){
  if(!M)return; const r=cv.getBoundingClientRect(), pad=28;
  const w=Math.max(M.box[2]-M.box[0],10), h=Math.max(M.box[3]-M.box[1],10);
  const s=Math.min((r.width-pad*2)/w,(r.height-pad*2)/h);
  const cx=(M.box[0]+M.box[2])/2-M.ox, cy=(M.box[1]+M.box[3])/2-M.oy;
  view.s=s; view.tx=r.width/2-cx*s; view.ty=r.height/2+cy*s; draw();
}
const toS=(x,y)=>[(x-M.ox)*view.s+view.tx, -(y-M.oy)*view.s+view.ty];
const toW=(sx,sy)=>[(sx-view.tx)/view.s+M.ox, -(sy-view.ty)/view.s+M.oy];
function draw(){
  const W=cv.width,H=cv.height; ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);
  if(!M)return;
  // çizgiler
  ctx.setTransform(dpr*view.s,0,0,-dpr*view.s,dpr*view.tx,dpr*view.ty);
  ctx.lineWidth=1.1/view.s; ctx.lineJoin='round'; ctx.lineCap='round';
  M.paths.forEach(g=>{if(!g.L.visible)return; ctx.strokeStyle=g.color; ctx.stroke(g.p);});
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const r=cv.getBoundingClientRect();
  // noktalar
  const rad=view.s>4?2.6:1.8;
  M.dots.forEach(it=>{if(!it.L.visible)return; const [x,y]=toS(it.xy[0][0],it.xy[0][1]); if(x<-5||y<-5||x>r.width+5||y>r.height+5)return;
    ctx.fillStyle=it.color; ctx.beginPath(); if(it.kind==='Symbol'){ctx.rect(x-rad-.5,y-rad-.5,2*rad+1,2*rad+1);} else ctx.arc(x,y,rad,0,Math.PI*2); ctx.fill();});
  // nokta adları (kalabalıkta okunur kalsın diye yeterince yakınlaşınca)
  if(showNames){
    const vis=[]; M.dots.forEach(it=>{if(!it.L.visible||!(it.name||'').trim())return; const [x,y]=toS(it.xy[0][0],it.xy[0][1]); if(x>-40&&y>-20&&x<r.width+40&&y<r.height+20)vis.push([it,x,y]);});
    if(vis.length&&vis.length<=600){
      ctx.font='600 11px system-ui,sans-serif'; ctx.textBaseline='bottom'; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.85)';
      const taken=[]; // üst üste binenleri atla
      vis.forEach(([it,x,y])=>{const t=it.name.trim(), w=ctx.measureText(t).width, bx=x+5, by=y-3;
        if(taken.some(b=>bx<b[2]&&bx+w>b[0]&&by-12<b[3]&&by>b[1]))return; taken.push([bx,by-12,bx+w,by]);
        ctx.strokeText(t,bx,by); ctx.fillStyle=it.color; ctx.fillText(t,bx,by);});
    }
  }
  // yazılar
  M.texts.forEach(it=>{if(!it.L.visible)return; const px=(it.h||1)*view.s; if(px<4)return; const [x,y]=toS(it.xy[0][0],it.xy[0][1]);
    if(x<-400||y<-200||x>r.width+400||y>r.height+200)return;
    ctx.save(); ctx.translate(x,y); if(it.rot)ctx.rotate(-it.rot*Math.PI/180); ctx.fillStyle=it.color; ctx.font=Math.min(px,200).toFixed(1)+'px system-ui,sans-serif'; ctx.textBaseline='alphabetic'; ctx.fillText(it.text,0,0); ctx.restore();});
  // elle çizilen şekiller
  if(UL.visible)US.forEach(sh=>{if(sh.pts.length<2)return; ctx.strokeStyle=UL.color; ctx.lineWidth=2.2; ctx.beginPath();
    sh.pts.forEach((p,i)=>{const [x,y]=toS(p.y,p.x); i?ctx.lineTo(x,y):ctx.moveTo(x,y);}); if(sh.closed)ctx.closePath(); ctx.stroke();
    if(sh.closed){ctx.fillStyle='rgba(255,210,63,.10)'; ctx.fill();}});
  // üçgen ağı (hacim)
  if(TIN){ctx.strokeStyle='rgba(63,208,143,.75)'; ctx.lineWidth=1; ctx.beginPath();
    TIN.tris.forEach(t=>{const a=toS(TIN.p[t[0]].y,TIN.p[t[0]].x),b=toS(TIN.p[t[1]].y,TIN.p[t[1]].x),c=toS(TIN.p[t[2]].y,TIN.p[t[2]].x); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.lineTo(c[0],c[1]); ctx.closePath();}); ctx.stroke();}
  // çizim modu
  if(drw.length){ctx.strokeStyle='#ffd23f'; ctx.lineWidth=3; ctx.beginPath(); drw.forEach((p,i)=>{const [x,y]=toS(p.y,p.x); i?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.stroke();
    if(drw.length>2){ctx.setLineDash([6,6]); const a=toS(drw[drw.length-1].y,drw[drw.length-1].x),b=toS(drw[0].y,drw[0].x); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.setLineDash([]);}
    drw.forEach((p,i)=>{const [x,y]=toS(p.y,p.x); ctx.fillStyle='#050806'; ctx.strokeStyle='#ffd23f'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(x,y,i?6:8,0,Math.PI*2); ctx.fill(); ctx.stroke();});}
  // ölçüm
  if(meas.length){
    ctx.strokeStyle='#3fd08f'; ctx.lineWidth=2.5; ctx.setLineDash([]); ctx.beginPath();
    meas.forEach((p,i)=>{const [x,y]=toS(p.x,p.y); i?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.stroke();
    if(meas.length>2){ctx.setLineDash([6,6]); const a=toS(meas[meas.length-1].x,meas[meas.length-1].y), b=toS(meas[0].x,meas[0].y); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='#3fd08f22'; ctx.beginPath(); meas.forEach((p,i)=>{const [x,y]=toS(p.x,p.y); i?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.closePath(); ctx.fill();}
    meas.forEach((p,i)=>{const [x,y]=toS(p.x,p.y); ctx.fillStyle='#050806'; ctx.strokeStyle='#3fd08f'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fill(); ctx.stroke();});
  }
  // koordinat imleci
  if(pick){const [x,y]=toS(pick.x,pick.y); ctx.strokeStyle='#3fd08f'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x-16,y); ctx.lineTo(x-5,y); ctx.moveTo(x+5,y); ctx.lineTo(x+16,y); ctx.moveTo(x,y-16); ctx.lineTo(x,y-5); ctx.moveTo(x,y+5); ctx.lineTo(x,y+16); ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y,9,0,Math.PI*2); ctx.stroke();}
  updateScale(r.width);
}
function updateScale(w){
  const target=w*0.22/view.s; const p=Math.pow(10,Math.floor(Math.log10(target))); const n=[1,2,5,10].find(k=>k*p>=target*0.6)*p;
  const px=n*view.s; const e=$('scale'); e.innerHTML=`<i style="width:${px.toFixed(0)}px"></i>${n>=1000?(n/1000)+' km':n<1?n.toFixed(2)+' m':n+' m'}`;
}
function zoomAt(f,cx,cy){const s=Math.min(5e4,Math.max(1e-4,view.s*f)); f=s/view.s; view.tx=cx-(cx-view.tx)*f; view.ty=cy-(cy-view.ty)*f; view.s=s; draw();}

/* ---------- dokunma ---------- */
(function(){
  const ptrs=new Map(); let moved=false, pinch=null, downAt=0, lastTap=0;
  const rel=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  cv.addEventListener('pointerdown',e=>{if(!M)return; cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,rel(e)); moved=false; downAt=Date.now();
    if(ptrs.size===2){const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])};}});
  cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return; const prev=ptrs.get(e.pointerId),cur=rel(e); ptrs.set(e.pointerId,cur);
    if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); if(pinch.d>0)zoomAt(d/pinch.d,(a[0]+b[0])/2,(a[1]+b[1])/2); pinch.d=d; moved=true; return;}
    const dx=cur[0]-prev[0],dy=cur[1]-prev[1]; if(Math.abs(dx)+Math.abs(dy)>1.5||moved){moved=true; view.tx+=dx; view.ty+=dy; draw();}});
  const up=e=>{const was=ptrs.has(e.pointerId); ptrs.delete(e.pointerId); if(ptrs.size<2)pinch=null;
    if(was&&!moved&&e.type==='pointerup'&&Date.now()-downAt<500){const [x,y]=rel(e); const now=Date.now();
      if(!mode&&now-lastTap<300){zoomAt(2,x,y); lastTap=0; return;} lastTap=now; tap(x,y);}};
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{e.preventDefault(); const [x,y]=rel(e); zoomAt(Math.exp(-e.deltaY*0.0015),x,y);},{passive:false});
})();
function snap(sx,sy){
  // ekranda 22 px içindeki en yakın köşe noktasına yapış
  const v=M.verts, lim=22/view.s; const [wx,wy]=toW(sx,sy); let best=-1,bd=lim*lim;
  for(let i=0;i<v.length;i+=2){const dx=v[i]-wx; if(dx>lim||dx<-lim)continue; const dy=v[i+1]-wy; if(dy>lim||dy<-lim)continue; const d=dx*dx+dy*dy; if(d<bd){bd=d;best=i;}}
  return best>=0?{x:v[best],y:v[best+1],snapped:true}:{x:wx,y:wy,snapped:false};
}
function nearestPoint(p){ // aynı yerdeki adlı nokta
  let best=null,bd=1e-6; M.dots.forEach(it=>{const d=Math.hypot(it.xy[0][0]-p.x,it.xy[0][1]-p.y); if(d<=bd){bd=d;best=it;}}); return best;
}
function tap(sx,sy){
  if(mode==='coord'){pick=snap(sx,sy); pick.pt=pick.snapped?nearestPoint(pick):null; draw(); showCoord();}
  else if(mode==='measure'){meas.push(snap(sx,sy)); draw(); showMeasure();}
  else if(mode==='draw'){const q=snap(sx,sy); if(!q.snapped){toast('Bir noktaya dokun');return;} const pt=nearestPoint(q); drw.push({n:pt&&pt.name?pt.name.trim():'',y:q.x,x:q.y,z:pt&&pt.z!=null?pt.z:null}); draw(); showDraw();}
}

function showMeasure(){

/* ---------- dışa aktarma biçimleri ---------- */
function buildGSI(pts){ // GSI-16, mm
  const val=v=>(v<0?'-':'+')+String(Math.round(Math.abs(v)*1000)).padStart(16,'0').slice(-16);
  return pts.map((p,i)=>{const nm=p.n.length>16?p.n.slice(-16):p.n;
    return '*11'+String((i+1)%10000).padStart(4,'0')+'+'+nm.padStart(16,'0')+' 81..00'+val(p.y)+' 82..00'+val(p.x)+' 83..00'+val(p.z)+' ';});
}
function buildCSV(pts){const c=v=>v.toFixed(3).replace('.',','); const q=t=>/[;"\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;
  return ['Nokta No;Y (Sağa);X (Yukarı);Z (Kot)',...pts.map(p=>[q(p.n),c(p.y),c(p.x),c(p.z)].join(';'))];}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  files.forEach(([name,text])=>{const nb=enc.encode(name),db=enc.encode(text),crc=crc32(db);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,crc,true);h.setUint32(18,db.length,true);h.setUint32(22,db.length,true);h.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(h.buffer),nb,db);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,crc,true);c.setUint32(20,db.length,true);c.setUint32(24,db.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+db.length;});
  const cl=cen.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cl,true);e.setUint32(16,off,true);
  const all=[...parts,...cen,new Uint8Array(e.buffer)],out=new Uint8Array(all.reduce((a,b)=>a+b.length,0));let o=0;all.forEach(b=>{out.set(b,o);o+=b.length;});return out;
}
function buildXLSX(pts){
  const x=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const str=(r,c,t)=>`<c r="${c}${r}" t="inlineStr"${r===1?' s="1"':''}><is><t>${x(t)}</t></is></c>`;
  const num=(r,c,v)=>v==null||!isFinite(v)?'':`<c r="${c}${r}" s="2"><v>${+v.toFixed(4)}</v></c>`;

function emptyModel(){return {file:'Yeni proje',items:[],layers:[],ox:0,oy:0,box:[0,0,10,10],version:'',unsupported:{},empty:true};}

  if(!M)M=emptyModel();

  M.items.forEach(it=>it.xy.forEach(q=>{if(q[0]<a)a=q[0];if(q[0]>c)c=q[0];if(q[1]<b)b=q[1];if(q[1]>d)d=q[1];}));

function parseLines(t){ // her satır: ad Y X Z  (ayraç boşluk, sekme, ; veya ,)
  const out=[],bad=[];
  t.split(/\r?\n/).forEach((raw,i)=>{const l=raw.trim(); if(!l)return;
    let tok=l.split(/[\s;\t]+/).filter(Boolean); if(tok.length<3)tok=l.split(/[\s,;\t]+/).filter(Boolean);
    let n='',k=0; if(tok.length>=4||!isFinite(num(tok[0]))){n=tok[0];k=1;}
    const y=num(tok[k]),x=num(tok[k+1]),z=num(tok[k+2]);
    if(!isFinite(y)||!isFinite(x)){bad.push(i+1);return;} out.push({n,y,x,z:isFinite(z)?z:null});});
  return {out,bad};
}

/* ---------- alan ve hacim ---------- */
function polyArea(P){let a=0; if(P.length<3)return 0; const y0=P[0].y,x0=P[0].x; for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length]; a+=(p.y-y0)*(q.x-x0)-(q.y-y0)*(p.x-x0);} return Math.abs(a)/2;}
function polyLen(P,closed){let l=0; for(let i=1;i<P.length;i++)l+=Math.hypot(P[i].y-P[i-1].y,P[i].x-P[i-1].x); if(closed&&P.length>2)l+=Math.hypot(P[0].y-P[P.length-1].y,P[0].x-P[P.length-1].x); return l;}
function pip(y,x,P){let c=false; for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j]; if((a.x>x)!==(b.x>x)&&y<(b.y-a.y)*(x-a.x)/(b.x-a.x)+a.y)c=!c;} return c;}
function delaunay(P){ // Bowyer–Watson; P: [{y,x}] → üçgen dizinleri
  const n=P.length; if(n<3)return [];
  let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity; P.forEach(p=>{if(p.y<a)a=p.y;if(p.y>c)c=p.y;if(p.x<b)b=p.x;if(p.x>d)d=p.x;});
  const my=(a+c)/2,mx=(b+d)/2,s=Math.max(c-a,d-b)||1;
  const V=P.map(p=>[p.y-my,p.x-mx]).concat([[-100*s,-100*s],[0,100*s],[100*s,-100*s]]);
  const mk=(i,j,k)=>{const [ax,ay]=V[i],[bx,by]=V[j],[cx,cy]=V[k]; const D=2*(ax*(by-cy)+bx*(cy-ay)+cx*(ay-by));
    if(Math.abs(D)<1e-12)return {i,j,k,x:0,y:0,r:Infinity};
    const A=ax*ax+ay*ay,B=bx*bx+by*by,C=cx*cx+cy*cy, ux=(A*(by-cy)+B*(cy-ay)+C*(ay-by))/D, uy=(A*(cx-bx)+B*(ax-cx)+C*(bx-ax))/D;
    return {i,j,k,x:ux,y:uy,r:(ax-ux)**2+(ay-uy)**2};};
  let T=[mk(n,n+1,n+2)];
  for(let p=0;p<n;p++){const [px,py]=V[p]; const keep=[],E=new Map();
    T.forEach(t=>{if((px-t.x)**2+(py-t.y)**2<t.r*(1+1e-9)){[[t.i,t.j],[t.j,t.k],[t.k,t.i]].forEach(([u,v])=>{const key=u<v?u+','+v:v+','+u; E.set(key,E.has(key)?null:[u,v]);});} else keep.push(t);});
    E.forEach(e=>{if(e)keep.push(mk(e[0],e[1],p));}); T=keep;}
  return T.filter(t=>t.i<n&&t.j<n&&t.k<n).map(t=>[t.i,t.j,t.k]);
}
function volume(P,tris,ref){ // kazı (referans üstü) ve dolgu (referans altı), m³
  let cut=0,fill=0,area=0;
  tris.forEach(t=>{const A=P[t[0]],B=P[t[1]],C=P[t[2]];
    const ar=Math.abs((B.y-A.y)*(C.x-A.x)-(C.y-A.y)*(B.x-A.x))/2; if(!ar)return; area+=ar;
    const h=[A.z-ref,B.z-ref,C.z-ref], net=ar*(h[0]+h[1]+h[2])/3, pos=h.filter(v=>v>0).length, neg=h.filter(v=>v<0).length;
    if(!neg){cut+=net;return;} if(!pos){fill-=net;return;}
    if(pos===1){const [p,u,v]=h.slice().sort((x,y)=>y-x); const cu=ar*p**3/(3*(p-u)*(p-v)); cut+=cu; fill+=cu-net;}
    else{const [q,u,v]=h.slice().sort((x,y)=>x-y), m=-q; const fi=ar*m**3/(3*(m+u)*(m+v)); fill+=fi; cut+=net+fi;}});
  return {cut,fill,area};
}
function openCalc(title,poly,zp){
  // aynı yerde iki nokta varsa birini al
  const seen=new Set(), Z=zp.filter(p=>{const k=p.y.toFixed(3)+','+p.x.toFixed(3); if(seen.has(k))return false; seen.add(k); return true;});
  const area=polyArea(poly), per=polyLen(poly,true);
  const tris=Z.length>=3?delaunay(Z):[];
  const zs=Z.map(p=>p.z), zmin=zs.length?Math.min(...zs):0, zmax=zs.length?Math.max(...zs):0;
  const ref0=openCalc.ref!=null&&isFinite(openCalc.ref)?openCalc.ref:zmin;
  sheet(title,`<div class="rrow"><span class="k">Nokta sayısı</span><span class="v">${poly.length}</span></div>
    <div class="rrow"><span class="k">Alan</span><span class="v">${area.toFixed(2)} m²</span></div>
    <div class="rrow"><span class="k">Çevre</span><span class="v">${per.toFixed(3)} m</span></div>
    <div class="sec">Hacim</div>
    ${tris.length?`<div class="refrow"><label for="cRef">Referans kot (taban ya da proje kotu)</label><input class="inp" id="cRef" inputmode="decimal" value="${ref0.toFixed(3)}"></div>
    <div id="cVol"></div>
    <label class="chk"><input type="checkbox" id="cTin" checked> Üçgenleri haritada göster</label>
    <p class="note">Hacim, kotlu ${Z.length} noktadan kurulan ${tris.length} üçgenli ağa (TIN) göre hesaplanır. Kazı referans kotun üstünde, dolgu altında kalan kısımdır. En düşük kot ${f3(zmin)}, en yüksek ${f3(zmax)}.</p>`
    :`<p class="note">Hacim için kotu (Z) olan en az 3 nokta gerekir. Şu an kotlu nokta sayısı: ${Z.length}. Noktalara Z değeri girersen hacim de hesaplanır.</p>`}
    <div class="two" style="margin-top:12px"><button id="cCopy2" type="button">Kopyala</button><button id="cBack" type="button">Noktalar</button></div>`);
  let res=null;
  const run=()=>{if(!tris.length)return; const ref=num($('cRef').value); if(!isFinite(ref)){$('cVol').innerHTML='<p class="note">Referans kotu sayı olarak yaz.</p>';res=null;return;}
    openCalc.ref=ref; res=volume(Z,tris,ref);
    $('cVol').innerHTML=`<div class="rrow"><span class="k">Kazı (üstte kalan)</span><span class="v cut">${res.cut.toFixed(2)} m³</span></div>
      <div class="rrow"><span class="k">Dolgu (altta kalan)</span><span class="v fill">${res.fill.toFixed(2)} m³</span></div>
      <div class="rrow"><span class="k">Net</span><span class="v">${(res.cut-res.fill).toFixed(2)} m³</span></div>
      <div class="rrow"><span class="k">Üçgen ağı alanı</span><span class="v">${res.area.toFixed(2)} m²</span></div>`;};
  if(tris.length){$('cRef').addEventListener('input',run); run(); TIN={p:Z,tris}; $('cTin').onchange=e=>{TIN=e.target.checked?{p:Z,tris}:null; draw();};} else TIN=null;
  draw();
  $('cCopy2').onclick=()=>copyText(`${title}\nAlan: ${area.toFixed(2)} m²\nÇevre: ${per.toFixed(3)} m`+(res?`\nReferans kot: ${f3(openCalc.ref)}\nKazı: ${res.cut.toFixed(2)} m³\nDolgu: ${res.fill.toFixed(2)} m³\nNet: ${(res.cut-res.fill).toFixed(2)} m³`:''));
  $('cBack').onclick=()=>{openPoints();};
}

  },30);
}
function openFile(){ if(AB&&AB.pickNcz)AB.pickNcz(); else $('fileIn').click(); }
$('fileIn').addEventListener('change',async()=>{const f=$('fileIn').files[0]; if(!f)return; const buf=new Uint8Array(await f.arrayBuffer()); $('fileIn').value=''; loadBytes(buf,f.name);});
window.onNativeFile=function(name,b64){ // Android'den gelen dosya
  try{const s=atob(b64),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);loadBytes(u,name);}catch(e){toast('Dosya okunamadı');}
};
window.__toast=toast;
$('openBtn').onclick=openFile; $('emptyOpen').onclick=openFile;
$('infoBtn').onclick=openAbout;
$('bLayers').onclick=openLayers; $('bExport').onclick=openExport;
$('bPoints').onclick=()=>{if(!M){newProject();return;} openPoints();}; $('newBtn').onclick=newProject;
$('bCoord').onclick=()=>setMode('coord'); $('bMeasure').onclick=()=>setMode('measure');
$('zFit').onclick=fit;
$('zNames').onclick=()=>{showNames=!showNames;$('zNames').setAttribute('aria-pressed',showNames);draw();};
$('zIn').onclick=()=>{const r=cv.getBoundingClientRect();zoomAt(1.6,r.width/2,r.height/2);};
$('zOut').onclick=()=>{const r=cv.getBoundingClientRect();zoomAt(1/1.6,r.width/2,r.height/2);};
window.addEventListener('resize',()=>{clearTimeout(resize.t);resize.t=setTimeout(()=>{const r=cv.getBoundingClientRect();const keep=M&&cv.width;resize();if(M&&!keep)fit();},120);});

/* ---------- örnek çizim (uydurma veri) ---------- */
$('demoBtn').onclick=()=>{
  const E=[],L=[],C=[];
  const lay=(n,c)=>{L.push(n);C.push(c);};
  lay('PARSEL',0xFFFFD23F); lay('BINA',0xFF4FD1E8); lay('YOL',0xFF9A9A9A); lay('NOKTA',0xFFFFFFFF); lay('KOT',0xFFFF5A5A); lay('YAZI',0xFF7BD88F); lay('DUVAR',0xFFFF9F43);
  const line=(layer,pts,closed)=>E.push({geometry_kind:closed?'Polygon':'Line',layer_name:layer,layer_code:L.indexOf(layer),color_argb:null,is_closed:!!closed,coordinates:pts.map(([x,y])=>({x,y,z:0}))});
  const pt=(layer,name,x,y,z)=>E.push({geometry_kind:'Point',layer_name:layer,layer_code:L.indexOf(layer),color_argb:null,name,coordinates:[{x,y,z}]});
  const tx=(layer,t,x,y,h,rot)=>E.push({geometry_kind:'Text',layer_name:layer,layer_code:L.indexOf(layer),color_argb:null,label_text:t,text_height:h,rotation_degrees:rot||0,coordinates:[{x,y,z:0}]});
  const X0=420800,Y0=4539600;
  // yol
  line('YOL',[[X0-20,Y0-12],[X0+140,Y0-12]]); line('YOL',[[X0-20,Y0-2],[X0+140,Y0-2]]);
  tx('YAZI','ÖRNEK SOKAK',X0+40,Y0-9,2.2);
  // parseller
  const P=[[0,0],[40,0],[80,0],[120,0]];
  P.forEach(([dx],i)=>{line('PARSEL',[[X0+dx,Y0],[X0+dx+38,Y0],[X0+dx+38,Y0+45],[X0+dx,Y0+45]],true); tx('YAZI',String(101+i),X0+dx+15,Y0+38,3);
    line('BINA',[[X0+dx+6,Y0+8],[X0+dx+30,Y0+8],[X0+dx+30,Y0+26],[X0+dx+6,Y0+26]],true);
    line('DUVAR',[[X0+dx,Y0+0.6],[X0+dx+38,Y0+0.6]]);
    [[0,0],[38,0],[38,45],[0,45]].forEach(([a,b],k)=>pt('NOKTA','P'+(i*4+k+1),X0+dx+a,Y0+b,12+((i+k)%3)*0.35));
  });
  for(let i=0;i<24;i++){const x=X0+4+(i%8)*16+((i*7)%5),y=Y0+4+Math.floor(i/8)*15+((i*3)%4),z=12.4+((i*37)%19)/10;
    pt('KOT','K'+(i+1),x,y,z); tx('KOT',z.toFixed(2),x+0.6,y+0.6,1.2);}
  tx('YAZI','ÖRNEK PAFTA · UYDURMA VERİ',X0,Y0+52,3.2);
  loadBytesModel({entities:E,layer_names:L,layer_colors:C,version_name:'',unsupported_geometry_types:{}},'ornek-pafta.NCZ');
};
function loadBytesModel(r,name){ // örnek için ayrıştırıcıyı atla
  M=buildModel(r,name); syncUser(); TIN=null; $('empty').hidden=true; $('fabs').hidden=false; $('scale').hidden=false; $('fname').textContent=name+' (örnek)';
  ['bLayers','bCoord','bMeasure','bExport'].forEach(id=>$(id).disabled=false); clearMode(); resize(); fit();
}
resize();
</script>
